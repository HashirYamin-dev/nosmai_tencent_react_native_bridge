apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.facebook.react'

react {
    root = file('../')
}


android {
    namespace 'com.nosmai.tencentrn'
    compileSdk 36
    defaultConfig { minSdk 24; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

repositories { google(); mavenCentral() }

dependencies {
    implementation 'com.facebook.react:react-android'
    // The Nosmai React Native SDK/app must provide ONE copy of its native runtime.
    // compileOnly uses headers without shipping a duplicate native AAR.
    compileOnly 'com.nosmai:nosmai-sdk:3.0.7@aar'
    implementation 'com.tencent.liteav:LiteAVSDK_Professional:13.5.0.20670'
}

rootProject.allprojects {
    repositories {
        ivy {
            url = uri('https://github.com/nosmai/nosmai_effects_sdk_android/releases/download')
            patternLayout { artifact('v[revision]/[artifact]-[revision].[ext]') }
            metadataSources { artifact() }
            content { includeModule('com.nosmai', 'nosmai-sdk') }
        }
    }
}
